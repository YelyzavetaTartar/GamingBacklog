<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GamingBacklog - Вхід</title>
    <!-- файл стилів -->
    <link rel="stylesheet" href="css/site.css" asp-append-version="true" />
    <style>
        
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
        }

            .login-card input {
                width: 100%;
                margin-bottom: 15px;
                display: block;
            }

        .btn-login {
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 12px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <!--  Navbar  -->
    <nav>
        <div class="logo"><strong>GamingBacklog</strong></div>
        <div class="menu">
            <a href="index.html">Головна</a>
            <a href="register.html">Реєстрація</a>
        </div>
    </nav>

    <div class="auth-wrapper">
        <!--  клас .card-->
        <div class="card login-card">
            <h2 style="text-align: center; color: #333;">Вхід</h2>

            <form action="javascript:void(0);" onsubmit="login()">
                <label style="color: #555; font-weight: 600;">Email:</label>
                <input type="email" id="email" placeholder="Введіть ваш email" required>

                <label style="color: #555; font-weight: 600;">Пароль:</label>
                <input type="password" id="pass" placeholder="Введіть пароль" required>

                <button type="submit" class="btn-login">Увійти</button>
            </form>

            <div style="text-align: center; margin-top: 15px;">
                <a href="register.html" style="color: #007bff; text-decoration: none; font-size: 14px;">Ще немає акаунта? Зареєструватися</a>
            </div>
        </div>
    </div>

    <!-- Універсальне модальне вікно для повідомлень -->
    <div id="authModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div id="modalIcon" style="font-size: 50px; margin-bottom: 10px;">⚠️</div>
            <h3 id="modalTitle" style="color: #333;">Увага</h3>
            <p id="modalMessage" style="color: #666; font-size: 16px; margin-bottom: 20px;"></p>
            <div class="modal-btns">
                <button onclick="closeAuthModal()" id="modalBtn" class="btn-primary" style="width: 100%;">Зрозуміло</button>
            </div>
        </div>
    </div>

    <script>
        function showAuthModal(message, isSuccess = false) {
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('modalTitle').innerText = isSuccess ? "Успіх!" : "Помилка";
            document.getElementById('modalIcon').innerText = isSuccess ? "✔" : "⚠️";
            document.getElementById('modalIcon').style.color = isSuccess ? "#28a745" : "#dc3545";
    
            document.getElementById('modalBtn').style.backgroundColor = isSuccess ? "#28a745" : "#007bff";
    
            document.getElementById('authModal').style.display = 'flex';
        }

        function closeAuthModal() {
            document.getElementById('authModal').style.display = 'none';
        }
        
        async function login() {
            const data = {
                email: document.getElementById('email').value,
                passwordHash: document.getElementById('pass').value
            };

            const response = await fetch('api/Auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                const result = await response.json();
                localStorage.setItem('userId', result.userId);
                localStorage.setItem('username', result.username);
                location.href = 'backlog.html';
            } else {
                showAuthModal("Невірний логін або пароль. Спробуйте ще раз.");
            }
        }
    </script>
</body>
</html>
