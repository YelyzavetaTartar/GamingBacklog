<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GamingBacklog</title>
    <link rel="stylesheet" href="css/site.css" />
</head>
<body>
    <h1>GamingBacklog</h1>
    <h2>Католог ігор</h2>
    <h3>Add Game</h3>
    <form action="javascript:void(0);" method="POST" onsubmit="addGame()">
        <input type="text" id="add-title" placeholder="New Game">
        <input type="text" id="add-description" placeholder="New Description Game">
        <input type="submit" value="Add">
    </form>

    <div id="editGame">
        <h3>Edit</h3>
        <form action="javascript:void(0);" onsubmit="updateGame()">
            <input type="hidden" id="edit-id">
            <input type="text" id="edit-title">
            <input type="text" id="edit-description">
            <input type="submit" value="Save">
            <a onclick="closeInput()" aria-label="Close">&#10006;</a>
        </form>
    </div>

    <p id="counter"></p>

    <table>
        <tr>
            <th>Name</th>
            <th>Description</th>
        </tr>
        <tbody id="games"></tbody>
    </table>

    <script src="js/lab2.js" asp-append-version="true"></script>
    <script type="text/javascript">
        getGames();
    </script>
</body>
</html>
