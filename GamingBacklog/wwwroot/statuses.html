<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GamingBacklog - Statuses</title>
    <link rel="stylesheet" href="css/site.css" />
</head>
<body>
    <h1>GamingBacklog</h1>
    <h2>Statuses</h2>
    <h3>Add Status</h3>
    <form action="javascript:void(0);" method="POST" onsubmit="addStatus()">
        <input type="text" id="add-status-name" placeholder="Status name">
        <input type="submit" value="Add">
    </form>

    <div id="editStatus" style="display:none;">
        <h3>Edit Status</h3>
        <form action="javascript:void(0);" onsubmit="updateStatus()">
            <input type="hidden" id="edit-status-id">
            <input type="text" id="edit-status-name">
            <input type="submit" value="Save">
            <a onclick="closeInput()" style="cursor:pointer;">&#10006;</a>
        </form>
    </div>

    <p id="counter"></p>

    <table>
        <tr>
            <th>Status name</th>
            <th colspan="2"></th>
        </tr>
        <tbody id="statuses"></tbody>
    </table>

    <script src="js/statuses.js" asp-append-version="true"></script>
    <script type="text/javascript">
        getStatuses();
    </script>
</body>
</html>
