<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GamingBacklog Platforms</title>
    <link rel="stylesheet" href="css/site.css" />
</head>
<body>
    <h1>GamingBacklog</h1>
    <h2>Platforms</h2>
    <h3>Add Platform</h3>
    <form action="javascript:void(0);" method="POST" onsubmit="addPlatform()">
        <input type="text" id="add-platform-name" placeholder="Platform name">
        <input type="submit" value="Add">
    </form>

    <div id="editPlatform" style="display:none;">
        <h3>Edit Platform</h3>
        <form action="javascript:void(0);" onsubmit="updatePlatform()">
            <input type="hidden" id="edit-platform-id">
            <input type="text" id="edit-platform-name">
            <input type="submit" value="Save">
            <a onclick="closeInput()" style="cursor:pointer;">&#10006;</a>
        </form>
    </div>

    <p id="counter"></p>

    <table>
        <tr>
            <th>Platform name</th>
            <th colspan="2"></th>
        </tr>
        <tbody id="platforms"></tbody>
    </table>

    <script src="js/platforms.js" asp-append-version="true"></script>
    <script type="text/javascript">
        getPlatforms();
    </script>
</body>
</html>
