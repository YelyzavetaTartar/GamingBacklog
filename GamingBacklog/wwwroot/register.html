<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GamingBacklog - Реєстрація</title>
    <link rel="stylesheet" href="css/site.css" />
    <style>
        .auth-container {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .btn-reg {
            width: 100%;
            background: #28a745;
            color: white;
            border: none;
            padding: 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
        }

            .btn-reg:hover {
                background: #218838;
            }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 350px;
            width: 90%;
        }

        .btn-ok {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
        }

            .btn-ok:hover {
                background: #218838;
         }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2 style="text-align: center;">Реєстрація</h2>
        <form action="javascript:void(0);" onsubmit="register()">
            <input type="text" id="reg-username" placeholder="Придумайте ім'я (Username)" required>
            <input type="email" id="reg-email" placeholder="Ваш Email" required>
            <input type="password" id="reg-password" placeholder="Придумайте пароль" required>
            <input type="password" id="reg-confirm" placeholder="Повторіть пароль" required>

            <button type="submit" class="btn-reg">Створити акаунт</button>
        </form>
        <a href="index.html" class="back-link">← Назад на головну</a>
    </div>

    <script>
        async function register() {
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;

            // Валідація паролів
            if (password !== confirm) {
                alert("Паролі не співпадають!");
                return;
            }

            // Дані для відправки 
            const data = {
                username: username,
                email: email,
                passwordHash: password 
            };

            try {
                const response = await fetch('api/Auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    const result = await response.json();

                    // Зберігаємо дані користувача в пам'ять браузера
                    localStorage.setItem('userId', result.userId);
                    localStorage.setItem('username', result.username);

                    document.getElementById('successModal').style.display = 'flex';
                } else {
                    const errorText = await response.text();
                    alert("Помилка реєстрації: " + errorText);
                }
            } catch (error) {
                console.error('Error:', error);
                alert("Не вдалося підключитися до сервера.");
            }
        }
        function closeAndRedirect() {
            window.location.href = 'backlog.html';
        }
    </script>

    <!-- Модальне вікно успішної реєстрації -->
    <div id="successModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div style="font-size: 50px; color: #28a745; margin-bottom: 10px;">✔</div>
            <h3>Вітаємо!</h3>
            <p>Реєстрація пройшла успішно. Тепер ви можете керувати своїм беклогом.</p>
            <div class="modal-btns">
                <button onclick="closeAndRedirect()" class="btn-ok">Перейти до списку ігор</button>
            </div>
        </div>
    </div>
</body>
</html>
