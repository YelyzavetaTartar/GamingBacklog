<!DOCTYPE html>
<html>
<head>

    <title>GamingBacklog - Вітаємо!</title>
    <link rel="stylesheet" href="css/site.css" />
    <style>
        .hero {
            text-align: center;
            margin-top: 100px;
        }

        .btn-group {
            margin-top: 30px;
        }

        .btn {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            margin: 10px;
        }

        .btn-login {
            background: #007bff;
            color: white;
        }

        .btn-reg {
            background: #28a745;
            color: white;
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>GamingBacklog</h1>
        <p>Ваш персональний органайзер ігрових досягнень</p>

        <div class="btn-group">
            <button class="btn btn-login" onclick="location.href='login.html'">Увійти</button>
            <button class="btn btn-reg" onclick="location.href='register.html'">Зареєструватися</button>
        </div>
    </div>
</body>
</html>
